<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1211" />
    <meta name="description" content="Plan workouts, track progress, and review every coach-suggested change with FitAI." />
    <script>
      (() => {
        let preference = 'dark';
        try {
          const saved = localStorage.getItem('fitai_theme');
          if (['dark', 'light', 'synthwave', 'tropical', 'system'].includes(saved)) preference = saved;
        } catch {}
        const theme = preference === 'system' ? ((window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true) ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = ['light', 'tropical'].includes(theme) ? 'light' : 'dark';
      })();
    </script>
    <title>FitAI — Train with intention</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
